apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cert-manager
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 1h
  values:
    crds:
      enabled: true
    # HTTP-01 self-checks resolve the host through public resolvers rather
    # than the node's chain. cert-manager asks for the name before
    # external-dns has created it, and the negative answer is cached by the
    # DigitalOcean VPC resolver for the zone's SOA minimum (Cloudflare: 1800s);
    # a fresh cluster then waits half an hour for a certificate it could have
    # had in a minute. Seen live on 2026-09-05 with an empty zone.
    extraArgs:
      - --acme-http01-solver-nameservers=1.1.1.1:53,1.0.0.1:53
    prometheus:
      enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
