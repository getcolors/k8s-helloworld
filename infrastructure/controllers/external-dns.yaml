apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-dns
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 1h
  values:
    provider:
      name: cloudflare
    sources:
      - ingress
    # sync, not upsert-only: the k8s package's delete prunes the application
    # and waits for this controller to withdraw its records before the
    # cluster goes, so the application host does not outlive it pointing at
    # a load balancer that no longer exists. The txt registry below scopes
    # what sync may delete to records this owner id created.
    policy: sync
    registry: txt
    txtOwnerId: k8s-digitalocean
    domainFilters:
      - bigconfig.online
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
