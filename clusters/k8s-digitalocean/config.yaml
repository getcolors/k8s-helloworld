apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 10m
  retryInterval: 30s
  timeout: 10m
  path: ./infrastructure/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: colors-app
