apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: config
  interval: 10m
  retryInterval: 30s
  timeout: 15m
  path: ./apps/hello-world
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: colors-app
